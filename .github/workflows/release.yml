name: Release

# On every merge/push to main (except our own release commits):
#   1. Semver-bump Cargo.toml from Conventional Commits since the last v* tag
#   2. Build MSI + binaries
#   3. Commit chore(release), tag vX.Y.Z, publish GitHub Release
#
# Manual: Actions → Release → Run workflow (choose major/minor/patch/auto)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # Avoid infinite loop when we push "chore(release): vX.Y.Z"
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $bump = "${{ github.event.inputs.bump }}"
          } else {
            $bump = "auto"
          }
          if ([string]::IsNullOrWhiteSpace($bump)) { $bump = "auto" }
          Write-Host "Bump mode: $bump"
          & .\.github\scripts\bump-version.ps1 -Bump $bump -WriteFiles

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Download WiX Toolset binaries
        shell: pwsh
        run: |
          $tools = Join-Path $pwd "tools\wix"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $zip = Join-Path $env:TEMP "wix314-binaries.zip"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tools -Force
          $root = Join-Path $pwd "tools\wix-root"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "bin") | Out-Null
          Copy-Item (Join-Path $tools "*") (Join-Path $root "bin") -Force
          Add-Content -Path $env:GITHUB_PATH -Value $tools
          Add-Content -Path $env:GITHUB_ENV -Value "WIX=$root"

      - name: Build release + MSI
        shell: pwsh
        run: |
          $env:WIX = Join-Path $pwd "tools\wix-root"
          $env:PATH = "$(Join-Path $pwd 'tools\wix');$env:PATH"
          cargo build --release --features "cli,gui"
          cargo wix --no-build --bin-path (Join-Path $pwd "tools\wix")

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/wix -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw "MSI not found under target/wix" }
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)" >> $env:GITHUB_OUTPUT
          Get-Item $msi.FullName | Format-List FullName, Length

      - name: Commit version bump and tag
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          git add Cargo.toml Cargo.lock
          $staged = git diff --cached --name-only
          if ($staged) {
            git commit -m "chore(release): $tag"
          } else {
            Write-Host "No Cargo.toml/Cargo.lock changes (catch-up release); tagging current HEAD"
          }
          if (git rev-parse -q --verify "refs/tags/$tag") {
            throw "Tag $tag already exists"
          }
          git tag -a $tag -m "Release $tag"
          git push origin HEAD:main
          git push origin $tag

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Telemetry Logging Utility ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          body: |
            Automated semver release (`${{ steps.ver.outputs.bump }}` — ${{ steps.ver.outputs.reason }}).

            - Version: `${{ steps.ver.outputs.version }}`
            - MSI installer + CLI (`tluw.exe`) + GUI (`tluw-gui.exe`)

            ### Install
            Download the `.msi` below and run it as Administrator.
          files: |
            ${{ steps.msi.outputs.path }}
            target/release/tluw.exe
            target/release/tluw-gui.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
