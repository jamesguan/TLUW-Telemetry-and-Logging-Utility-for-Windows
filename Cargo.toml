[package]
name = "windows-diagnostics"
version = "0.3.0"
edition = "2021"
description = "CLI and GUI tools to inspect and toggle Windows diagnostic data / telemetry"
license = "MIT"
readme = "README.md"
authors = ["James Guan"]
homepage = "https://github.com/jamesguan/disable-windows-diagnostics"
repository = "https://github.com/jamesguan/disable-windows-diagnostics"
keywords = ["windows", "telemetry", "privacy", "diagnostics", "cli"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "windows_diagnostics"
path = "src/lib.rs"

[[bin]]
name = "windows-diagnostics"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "windows-diagnostics-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["cli", "gui"]
cli = ["dep:clap"]
gui = ["dep:eframe", "dep:egui"]

[dependencies]
winreg = "0.55"
clap = { version = "4", features = ["derive"], optional = true }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[package.metadata.wix]
# MSI name / product
name = "Windows Diagnostics"
# Include both binaries via custom wix/main.wxs
eula = false
license = false
product-icon = false
# Path where MSI is written (relative to target/)
include = []
