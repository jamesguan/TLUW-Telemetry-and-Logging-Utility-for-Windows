[package]
name = "windows-diagnostics"
version = "0.3.0"
edition = "2021"
description = "CLI and GUI tools to inspect and toggle Windows diagnostic data / telemetry"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
authors = ["James Guan"]
homepage = "https://github.com/jamesguan/disable-windows-diagnostics"
repository = "https://github.com/jamesguan/disable-windows-diagnostics"
keywords = ["windows", "telemetry", "privacy", "diagnostics", "cli"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "windows_diagnostics"
path = "src/lib.rs"

[[bin]]
name = "windows-diagnostics"
path = "src/bin/cli.rs"
required-features = ["cli"]

[[bin]]
name = "windows-diagnostics-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["cli", "gui"]
cli = ["dep:clap"]
gui = ["dep:eframe", "dep:egui", "dep:tray-icon", "dep:raw-window-handle", "dep:image"]

[dependencies]
winreg = "0.55"
clap = { version = "4", features = ["derive"], optional = true }
eframe = { version = "0.31", default-features = true, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.31", optional = true }
tray-icon = { version = "0.19", optional = true }
raw-window-handle = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[build-dependencies]
winres = "0.1"

[package.metadata.wix]
# MSI name / product
name = "Windows Diagnostics"
# Include both binaries via custom wix/main.wxs
eula = false
license = false
product-icon = "assets/windows-diagnostics-icon.ico"
# Path where MSI is written (relative to target/)
include = []
